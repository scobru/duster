name: Build Audio Plugins (VST3, AU, AAX, Standalone)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Tag name for release (optional, e.g. v1.0.1)'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS (Universal arm64 + x86_64)
    runs-on: macos-14
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="10.15"

      - name: Build Plugins
        run: |
          cmake --build build --config Release --parallel

      - name: Package macOS Artifacts
        run: |
          mkdir -p artifacts/macOS
          cd build/Duster_artefacts/Release
          
          # Copia i componenti AU, VST3, Standalone e AAX (Pro Tools)
          if [ -d "AU/Duster.component" ]; then
            cp -R "AU/Duster.component" ../../../artifacts/macOS/
          fi
          if [ -d "VST3/Duster.vst3" ]; then
            cp -R "VST3/Duster.vst3" ../../../artifacts/macOS/
          fi
          if [ -d "Standalone/Duster.app" ]; then
            cp -R "Standalone/Duster.app" ../../../artifacts/macOS/
          fi
          if [ -d "AAX/Duster.aaxplugin" ]; then
            cp -R "AAX/Duster.aaxplugin" ../../../artifacts/macOS/
          fi
          
          cd ../../../artifacts
          cp ../README.md macOS/ || true
          zip -r -y Duster-macOS-Universal.zip macOS/

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Duster-macOS
          path: artifacts/Duster-macOS-Universal.zip
          retention-days: 30

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build -A x64

      - name: Build Plugins
        run: |
          cmake --build build --config Release --parallel

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\Windows | Out-Null
          
          # VST3 bundle
          if (Test-Path "build\Duster_artefacts\Release\VST3\Duster.vst3") {
            Copy-Item -Recurse "build\Duster_artefacts\Release\VST3\Duster.vst3" "artifacts\Windows\"
          }
          
          # Standalone .exe
          if (Test-Path "build\Duster_artefacts\Release\Standalone\Duster.exe") {
            Copy-Item "build\Duster_artefacts\Release\Standalone\Duster.exe" "artifacts\Windows\"
          }
          
          # AAX bundle (Pro Tools)
          if (Test-Path "build\Duster_artefacts\Release\AAX\Duster.aaxplugin") {
            Copy-Item -Recurse "build\Duster_artefacts\Release\AAX\Duster.aaxplugin" "artifacts\Windows\"
          }
          
          # Helper scripts & README
          if (Test-Path "install_vst3.bat") { Copy-Item "install_vst3.bat" "artifacts\Windows\" }
          if (Test-Path "run_standalone.bat") { Copy-Item "run_standalone.bat" "artifacts\Windows\" }
          if (Test-Path "README.md") { Copy-Item "README.md" "artifacts\Windows\" }
          
          Compress-Archive -Path artifacts\Windows\* -DestinationPath artifacts\Duster-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Duster-Windows
          path: artifacts/Duster-Windows-x64.zip
          retention-days: 30

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    needs: [ build-macos, build-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Duster-macOS
          path: release-assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Duster-Windows
          path: release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ (inputs.tag_name != '' && inputs.tag_name) || github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
