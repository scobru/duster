name: Build Audio Plugins (VST3, AU, Standalone)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS (Universal arm64 + x86_64)
    runs-on: macos-14
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="10.15"

      - name: Build Plugins
        run: |
          cmake --build build --config Release --parallel

      - name: Package macOS Artifacts
        run: |
          mkdir -p artifacts
          cd build/SpectraDenoiser_artefacts/Release
          
          # Copia i componenti AU, VST3 e Standalone
          mkdir -p ../../../artifacts/macOS
          if [ -d "AU/Spectra Denoiser.component" ]; then
            cp -R "AU/Spectra Denoiser.component" ../../../artifacts/macOS/
          fi
          if [ -d "VST3/Spectra Denoiser.vst3" ]; then
            cp -R "VST3/Spectra Denoiser.vst3" ../../../artifacts/macOS/
          fi
          if [ -d "Standalone/Spectra Denoiser.app" ]; then
            cp -R "Standalone/Spectra Denoiser.app" ../../../artifacts/macOS/
          fi
          
          cd ../../../artifacts
          zip -r -y SpectraDenoiser-macOS-Universal.zip macOS/

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpectraDenoiser-macOS
          path: artifacts/SpectraDenoiser-macOS-Universal.zip
          retention-days: 30

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build -A x64

      - name: Build Plugins
        run: |
          cmake --build build --config Release --parallel

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\Windows | Out-Null
          
          # VST3 bundle
          Copy-Item -Recurse "build\SpectraDenoiser_artefacts\Release\VST3\Spectra Denoiser.vst3" "artifacts\Windows\"
          
          # Standalone .exe
          Copy-Item "build\SpectraDenoiser_artefacts\Release\Standalone\Spectra Denoiser.exe" "artifacts\Windows\"
          
          # Helper scripts & README
          Copy-Item "install_vst3.bat" "artifacts\Windows\"
          Copy-Item "run_standalone.bat" "artifacts\Windows\"
          Copy-Item "README.md" "artifacts\Windows\"
          
          Compress-Archive -Path artifacts\Windows\* -DestinationPath artifacts\SpectraDenoiser-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpectraDenoiser-Windows
          path: artifacts/SpectraDenoiser-Windows-x64.zip
          retention-days: 30

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-macos, build-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: SpectraDenoiser-macOS
          path: release-assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: SpectraDenoiser-Windows
          path: release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
